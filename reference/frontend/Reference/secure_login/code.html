<!DOCTYPE html>
<!--
  Luminous POS - Secure Login
  Requirement: FR-AUT-01 (autentikasi JWT). Error: E-AUTH-401.
  Catatan: panduan VISUAL saja. Perilaku & data dari SRS/FR + API (Backend.md §8.1: POST /auth/login).
-->
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Luminous POS - Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: { extend: {
          "colors": {
            "primary": "#006c47", "on-primary": "#ffffff", "primary-container": "#00885a",
            "on-primary-container": "#000703", "primary-fixed": "#7efabd", "primary-fixed-dim": "#60dda2",
            "secondary": "#994700", "secondary-container": "#fe852b", "on-secondary": "#ffffff",
            "tertiary": "#555e5b", "background": "#fbf9f7", "on-background": "#1b1c1b",
            "surface": "#fbf9f7", "on-surface": "#1b1c1b", "surface-variant": "#e4e2e0",
            "on-surface-variant": "#414942", "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f5f3f1", "surface-container": "#efeeeb",
            "surface-container-high": "#e9e8e6", "surface-container-highest": "#e4e2e0",
            "surface-dim": "#dbdad8", "outline": "#717972", "outline-variant": "#c0c9c0",
            "error": "#ba1a1a", "on-error": "#ffffff", "error-container": "#ffdad6", "on-error-container": "#93000a"
          },
          "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          "spacing": { "xl": "48px", "lg": "32px", "md": "24px", "gutter": "24px", "container-margin": "32px", "base": "4px", "sm": "16px", "xs": "8px" },
          "fontFamily": { "headline-xl": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"] },
          "fontSize": {
            "headline-xl": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "headline-lg": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "headline-md": ["20px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
            "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
          }
        } }
      }
    </script>
<style>
      body {
        background-color: #FBF9F7;
        background-image:
          radial-gradient(at 0% 0%, hsla(158,100%,74%,0.18) 0px, transparent 50%),
          radial-gradient(at 100% 0%, hsla(28,100%,74%,0.10) 0px, transparent 50%),
          radial-gradient(at 50% 100%, hsla(158,100%,74%,0.18) 0px, transparent 50%);
        background-attachment: fixed; min-height: 100vh; overflow-x: hidden;
      }
      .glass-panel { background-color: rgba(255,255,255,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.5); border-radius: 1.5rem; }
      .ambient-shadow { box-shadow: 0 20px 40px -10px rgba(0,108,71,0.08); }
      .btn-primary-glow { background: linear-gradient(135deg, #00885a 0%, #006c47 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 10px 20px -5px rgba(0,108,71,0.2); border: 1px solid rgba(0,108,71,0.1); }
    </style>
</head>
<body class="text-on-surface font-body-md antialiased flex items-center justify-center p-sm">
<main class="w-full max-w-md">
<!-- Brand -->
<div class="flex flex-col items-center mb-lg">
<div class="w-16 h-16 rounded-full btn-primary-glow flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">point_of_sale</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">Luminous POS</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Sign in to your terminal</p>
</div>
<!-- Login Card -->
<div class="glass-panel ambient-shadow p-md md:p-lg">
<!-- Error banner (E-AUTH-401) - hidden by default -->
<div class="hidden items-center gap-3 bg-error-container/40 border border-error/20 text-on-error-container rounded-xl px-4 py-3 mb-6" id="error-banner">
<span class="material-symbols-outlined text-error">error</span>
<span class="font-body-md text-body-md">Invalid email or password.</span>
</div>
<form class="flex flex-col gap-5" id="login-form">
<!-- Email -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase mb-2" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute inset-y-0 left-0 pl-4 flex items-center text-on-surface-variant text-[20px]">mail</span>
<input class="block w-full pl-12 pr-4 py-3 bg-surface-container text-on-surface font-body-lg rounded-xl border border-outline-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="email" placeholder="sarah.j@store.com" type="email" autocomplete="username"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase mb-2" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute inset-y-0 left-0 pl-4 flex items-center text-on-surface-variant text-[20px]">lock</span>
<input class="block w-full pl-12 pr-12 py-3 bg-surface-container text-on-surface font-body-lg rounded-xl border border-outline-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="password" placeholder="••••••••" type="password" autocomplete="current-password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant hover:text-primary transition-colors" id="toggle-pw" type="button" aria-label="Show password">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded border-outline-variant text-primary focus:ring-primary/30" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant">Remember this device</span>
</label>
<a class="font-body-md text-body-md text-primary font-medium hover:underline" href="#">Forgot?</a>
</div>
<!-- Submit -->
<button class="w-full btn-primary-glow text-on-primary font-headline-md text-headline-md py-3 rounded-xl hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 mt-2" type="submit">
<span class="material-symbols-outlined">login</span>
            Sign In
        </button>
</form>
</div>
<!-- Connection status -->
<div class="flex items-center justify-center gap-2 mt-lg">
<span class="w-2 h-2 rounded-full bg-primary-fixed-dim"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Secure connection • HTTPS</span>
</div>
</main>
<script>
      // Demo only: toggle password visibility. Auth nyata via POST /auth/login (JWT).
      document.getElementById('toggle-pw').addEventListener('click', (e) => {
        const pw = document.getElementById('password');
        const icon = e.currentTarget.querySelector('.material-symbols-outlined');
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        icon.textContent = show ? 'visibility_off' : 'visibility';
      });
    </script>
</body></html>
